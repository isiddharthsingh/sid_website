  <!-- Preloader choreography: fills a fake progress bar while React/Babel
       boot, snaps to 100% the moment the app signals ready, then wipes up. -->
  <script>
  (function () {
    var fill = document.getElementById('pre-fill');
    var pctEl = document.getElementById('pre-pct');
    var pre = document.getElementById('preloader');
    if (!pre) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var pct = 0, settled = false, dismissed = false;
    function paint(v) {
      v = Math.max(0, Math.min(100, v));
      if (fill) fill.style.width = v + '%';
      if (pctEl) pctEl.textContent = Math.round(v);
    }
    function dismiss() {
      if (dismissed) return; dismissed = true;
      pct = 100; paint(100);
      setTimeout(function () {
        pre.classList.add('done');
        document.documentElement.classList.add('app-revealed');
        setTimeout(function () { if (pre && pre.parentNode) pre.parentNode.removeChild(pre); }, 900);
      }, 180);
    }
    // creep toward 90% on an ease-out curve while we wait
    var iv = setInterval(function () {
      if (settled) return;
      var ceiling = 90;
      pct += (ceiling - pct) * 0.08 + 0.4;
      if (pct > ceiling) pct = ceiling;
      paint(pct);
    }, 90);
    function finish() {
      settled = true; clearInterval(iv);
      dismiss();
    }
    // app.jsx sets this true after first render
    var poll = setInterval(function () {
      if (window.__appReady) { clearInterval(poll); finish(); }
    }, 60);
    // hard safety net
    setTimeout(function () { clearInterval(poll); finish(); }, 6000);
    if (reduce) { clearInterval(iv); }
  })();
  </script>
